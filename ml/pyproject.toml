[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hcmc-road-flood-ml"
version = "0.1.0"
description = "Reproducible old-HCMC road flood susceptibility research"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0", "joblib>=1.5", "matplotlib>=3.9", "numpy>=2.0", "osmium>=4.0",
  "pandas>=2.2", "pyarrow>=18", "pyogrio>=0.10", "pyproj>=3.7",
  "pyyaml>=6.0", "rasterio>=1.4", "scikit-learn>=1.5", "shapely>=2.0", "wandb>=0.23",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/flood_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
include = ["*.py", "*.pyi", "*.ipynb", "pyproject.toml"]
